{% extends 'base.html' %}
{% block title %}登录 - 仿猫眼票务{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap">
    <div class="auth-box">
      <h2>欢迎登录</h2>
      <form method="post">
        <div class="field">
          <label>用户名</label>
          <input type="text" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <button class="btn block" type="submit">登 录</button>
      </form>
      <div class="auth-link">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></div>
      <div class="auth-link" style="color:#aaa;margin-top:14px;">测试账号：商家 shop01 / 用户 user01（密码均 123456）</div>
    </div>
  </div>
</div>
{% endblock %}
