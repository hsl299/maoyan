{% extends 'merchant/base.html' %}
{% block mcontent %}
<div class="page-title"><span>{{ '编辑票品' if ticket else '新增票品' }}</span></div>
<div class="order-detail" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    <div class="field"><label>票品名称 *</label>
      <input type="text" name="title" value="{{ ticket.title if ticket else '' }}" required></div>
    <div class="field"><label>类型</label>
      <select name="type">
        <option value="0" {{ 'selected' if ticket and ticket.type==0 else '' }}>电影</option>
        <option value="1" {{ 'selected' if ticket and ticket.type==1 else '' }}>演出</option>
      </select></div>
    <div class="field"><label>封面上传（从电脑选择图片）</label>
      <input type="file" name="cover_file" accept="image/*">
      <div style="margin-top:6px;font-size:12px;color:#999;">支持 png / jpg / jpeg / gif / webp</div>
      {% if ticket and ticket.cover %}
      <div style="margin-top:8px;">
        <img src="{{ ticket.cover if ticket.cover.startswith('http') else url_for('static', filename=ticket.cover) }}"
             style="width:120px;height:160px;object-fit:cover;border-radius:6px;border:1px solid #eee;">
        <div style="font-size:12px;color:#999;margin-top:4px;">当前封面</div>
      </div>
      {% endif %}
    </div>
    <div class="field"><label>或封面图 URL（选填，留空则用上传的图片或默认海报）</label>
      <input type="text" name="cover" value="{{ ticket.cover if ticket else '' }}" placeholder="https://..."></div>
    <div class="field"><label>{{ '主演' if (not ticket) or ticket.type==0 else '嘉宾' }}</label>
      <input type="text" name="actors" value="{{ ticket.actors if ticket else '' }}" placeholder="如：吴京 / 刘德华"></div>
    <div class="field"><label>时长（分钟）</label>
      <input type="number" name="duration" value="{{ ticket.duration if ticket else 120 }}"></div>
    <div class="field"><label>放映 / 演出地址</label>
      <input type="text" name="address" value="{{ ticket.address if ticket else '' }}"></div>
    <div class="field"><label>简介</label>
      <textarea name="intro" placeholder="票品详细介绍…">{{ ticket.intro if ticket else '' }}</textarea></div>
    <div style="display:flex;gap:12px;">
      <button class="btn" type="submit">保 存</button>
      <a class="btn gray" href="{{ url_for('merchant.ticket_list') }}">返回</a>
    </div>
  </form>
</div>
{% endblock %}
