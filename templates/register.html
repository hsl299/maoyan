{% extends 'base.html' %}
{% block title %}注册 - 仿猫眼票务{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap">
    <div class="auth-box">
      <h2>注册账号</h2>
      <form method="post">
        <div class="field">
          <label>用户名</label>
          <input type="text" name="username" placeholder="6-20位用户名" required>
        </div>
        <div class="field">
          <label>昵称</label>
          <input type="text" name="nickname" placeholder="选填，默认同用户名">
        </div>
        <div class="field">
          <label>手机号</label>
          <input type="text" name="phone" placeholder="选填">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" name="password" placeholder="至少6位" required>
        </div>
        <div class="field">
          <label>确认密码</label>
          <input type="password" name="confirm" placeholder="再次输入密码" required>
        </div>
        <div class="field">
          <label>注册身份</label>
          <div class="role-group">
            <label><input type="radio" name="role" value="0" checked> 普通用户</label>
            <label><input type="radio" name="role" value="1"> 商家</label>
          </div>
        </div>
        <button class="btn block" type="submit">注 册</button>
      </form>
      <div class="auth-link">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></div>
    </div>
  </div>
</div>
{% endblock %}
